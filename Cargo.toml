[package]
name = "creek"
version = "0.1.0"
edition = "2024"

[features]
luajit = ["mlua"]
vulkan = ["ash", "ash-window", "winit"]

[dependencies]
ash = { version = "0.38.0", optional = true, default-features = false, features = ["linked", "debug", "std"] }
ash-window = { version = "0.13.0", optional = true }
mlua = { version = "0.9", optional = true, features = ["luajit"] }
winit = { version = "0.29", optional = true, features = ["rwh_06"] }
